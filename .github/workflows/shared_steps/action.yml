name: "Shared Build Steps"
runs:
  using: "composite"
  # Note: working directory will be reset to the repo root for each new step
  steps:
    # Use a fixed CMake version
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.3'

    # Build and install all dependencies to DRDK installation directory.
    - name: Build and install dependencies
      shell: bash
      run: |
        cmake --version
        cd thirdparty
        bash build_and_install_dependencies.sh ~/drdk_install 8

    # Configure CMake, then build and install flexiv_drdk library to DRDK installation directory.
    - name: Build and install library
      shell: bash
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=~/drdk_install
        cmake --build . --target install --config Release

    # Find and link to flexiv_drdk library, then build all example programs.
    - name: Build examples
      shell: bash
      run: |
        cd example
        mkdir -p build && cd build
        cmake .. -DCMAKE_PREFIX_PATH=~/drdk_install
        cmake --build . --config Release -j 8
